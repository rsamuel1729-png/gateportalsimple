{% extends "base.html" %}{% block title %}Resource{% endblock %}{% block content %}<form class="form card" method="post"><a class="back-link" href="/admin">← Admin dashboard</a><h1>{{'Edit' if material else 'Add'}} resource</h1><label>Title<input name="title" required value="{{material.title if material else ''}}"></label><label>Course<select name="subject" required><option value="">Choose a course</option>{% for c in courses %}<option value="{{c[1]}}" {% if material and material.subject==c[1] %}selected{% endif %}>{{c[1]}}</option>{% endfor %}</select></label><label>Description<textarea name="description" rows="4" required>{{material.description if material else ''}}</textarea></label><label>Resource type<select name="resource_type" required>{% for key,label in resource_types.items() %}<option value="{{key}}" {% if material and material.resource_type==key %}selected{% endif %}>{{label}}</option>{% endfor %}</select></label><label>Resource URL<input name="url" type="url" required value="{{material.url if material else ''}}" placeholder="https://..."></label><button class="btn">Save resource</button></form>{% endblock %}
